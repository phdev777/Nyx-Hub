<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#01040D" />
    <meta name="color-scheme" content="dark light" />
    <!-- Tema escolhido pela pessoa (claro ou escuro), aplicado antes de pintar a página. Padrão: escuro. -->
    <script>
      try {
        if (localStorage.getItem('nyx-tema') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name=theme-color]').content = '#FBFCFF'
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nyx Hub — Software sob demanda</title>
    <meta name="description" content="A Nyx Hub cria sistemas, automações e sites sob medida para empresas que cansaram de planilha, retrabalho e ferramenta que não conversa com a operação." />
    <meta property="og:title" content="Nyx Hub — Software sob demanda" />
    <meta property="og:description" content="Sistemas, automações e sites sob medida, do jeito que a sua operação funciona." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Nyx Hub" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui,sans-serif;color:#f3f7fe;background:#01040d">Nyx Hub: sistemas, automações e sites sob medida. Ative o JavaScript para ver o site completo.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
